services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"     # Port HTTP standar
      - "443:443"   # Port HTTPS standar
      - "8080:81"     # Port untuk mengakses Web GUI Admin NPM
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - net-public-npm
  nginx:
    # Satu-satunya service yang diekspos ke host.
    image: nginx:alpine
    container_name: wp-nginx-npm
    restart: unless-stopped
    depends_on:
      - wordpress1
      - wordpress2
      - wordpress3
    volumes:
      - wordpress_data1-npm:/var/www/html/site1-npm:ro
      - wordpress_data2-npm:/var/www/html/site2-npm:ro
      - wordpress_data3-npm:/var/www/html/site3-npm:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx/wordpress:size=100M
    networks:
      - net-public-npm
      - net-internal-npm
    cpus: "0.25"
    mem_limit: 128m

  wordpress1:
    # WordPress berjalan sebagai PHP-FPM agar Nginx menangani request web.
    image: wordpress:php8.4-fpm-alpine
    container_name: wp-web1-npm
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST1}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER1}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD1}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME1}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_HOME', 'http://wp1.sunuy.my.id');
        define('WP_SITEURL', 'http://wp1.sunuy.my.id');
        define('WP_REDIS_PREFIX', 'wp1:');
        
        if ( isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https' ) {
            $$_SERVER['HTTPS'] = 'on';
        }

    volumes:
      - wordpress_data1-npm:/var/www/html
    networks:
      - net-internal-npm
      - net-public-npm
    cpus: "0.35"
    mem_limit: 512m

  wordpress2:
    # WordPress berjalan sebagai PHP-FPM agar Nginx menangani request web.
    image: wordpress:php8.4-fpm-alpine
    container_name: wp-web2-npm
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST2}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER2}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD2}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME2}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_HOME', 'http://wp2.sunuy.my.id');
        define('WP_SITEURL', 'http://wp2.sunuy.my.id');
        define('WP_REDIS_PREFIX', 'wp2:');

        if ( isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https' ) {
            $$_SERVER['HTTPS'] = 'on';
        }

    volumes:
      - wordpress_data2-npm:/var/www/html
    networks:
      - net-internal-npm
      - net-public-npm
    cpus: "0.35"
    mem_limit: 512m

  wordpress3:
    # WordPress berjalan sebagai PHP-FPM agar Nginx menangani request web.
    image: wordpress:php8.4-fpm-alpine
    container_name: wp-web3-npm
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST3}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER3}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD3}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME3}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_HOME', 'http://wp3.sunuy.my.id');
        define('WP_SITEURL', 'http://wp3.sunuy.my.id');
        define('WP_REDIS_PREFIX', 'wp3:');

        if ( isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https' ) {
            $$_SERVER['HTTPS'] = 'on';
        }

    volumes:
      - wordpress_data3-npm:/var/www/html
    networks:
      - net-internal-npm
      - net-public-npm
    cpus: "0.35"
    mem_limit: 512m

  mariadb:
    # Database dipisah dan hanya bisa diakses lewat network internal.
    image: mariadb:11
    container_name: wp-db-npm
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_data-npm:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - net-internal-npm
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "0.5"
    mem_limit: 512m

  redis:
    image: redis:alpine
    container_name: wp-redis-npm
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "no",
        "--save",
        "",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    networks:
      - net-internal-npm
    cpus: "0.20"
    mem_limit: 128m

volumes:
  mariadb_data-npm:
  wordpress_data1-npm:
  wordpress_data2-npm:
  wordpress_data3-npm:
  npm_data:
  npm_letsencrypt:

networks:
  net-internal-npm:
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.23.0.0/24
        - subnet: fd00:deab:beef::/64
  net-public-npm:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.24.0.0/24
        - subnet: fd00:beed:dead::/64