map $request_method $skip_cache_method {
    default 0;
    POST 1;
}

map $query_string $skip_cache_query {
    default 0;
    ~*(^|&)(preview|customize_changeset_uuid|elementor-preview|nocache|cache-bust)= 1;
}

map $http_cookie $skip_cache_cookie {
    default 0;
    ~*wordpress_logged_in_ 1;
    ~*wp-postpass_ 1;
    ~*comment_author_ 1;
}

map $request_uri $skip_cache_admin {
    default 0;
    ~*^/wp-admin/ 1;
    ~*^/wp-login\.php$ 1;
}

map "$skip_cache_method$skip_cache_cookie$skip_cache_admin$skip_cache_query" $skip_cache {
    default 0;
    ~1 1;
}

fastcgi_cache_path /var/cache/nginx/wp1-npm
levels=1:2
keys_zone=WP1:30m
inactive=60m
max_size=80m
use_temp_path=off;

fastcgi_cache_path /var/cache/nginx/wp2-npm
levels=1:2
keys_zone=WP2:30m
inactive=60m
max_size=80m
use_temp_path=off;

fastcgi_cache_path /var/cache/nginx/wp3-npm
levels=1:2
keys_zone=WP3:30m
inactive=60m
max_size=80m
use_temp_path=off;

server {
    listen [::]:80;
    listen 80;
    server_name wp1.xixiqo.my.id;

    root /var/www/html/site1-npm;
    index index.php index.html;
    client_max_body_size 32m;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass wordpress1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";

        fastcgi_cache WP1;
        fastcgi_cache_key "$scheme$request_method$host:$server_port$request_uri";
        fastcgi_cache_valid 200 301 302 60m;
        fastcgi_cache_use_stale error timeout invalid_header http_500 http_503 updating;
        fastcgi_cache_lock on;
        fastcgi_cache_background_update on;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;

        add_header X-FastCGI-Cache $upstream_cache_status always;
    }

    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    location ~* \.([^.]+)$ {
        expires max;
        log_not_found off;
    }
}


